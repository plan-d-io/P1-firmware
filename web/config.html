<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital meter dongle</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <noscript>Enable JavaScript to configure this dongle. A read-only status page is at <a href="/status">/status</a>.</noscript>
  <h2>Digital meter dongle</h2>
  <h2 id="hostnameHeader"></h2>
  <p class="msg" id="wifiFailBanner" style="display:none;color:#e0a86a"></p>
  <p class="msg" id="infoMessage"></p>
  <p class="msg" id="netPendingBanner" style="display:none;color:#5aaf6f"></p>
  <p class="field-hint" id="netPendingHint" style="display:none">After the reboot, the dongle joins your network. You can find it at http://p1dongle.local, or as 'p1dongle' in your router's list of devices.</p>

  <div class="svg-container" aria-label="Status">
    <div class="ind" id="ind-wifi"></div>
    <div class="ind" id="ind-meter"></div>
    <div class="ind" id="ind-broker"></div>
    <div class="ind" id="ind-ha"></div>
  </div>

  <button type="button" class="collapsible active" id="realTimeDataCollapsible">Real-time data</button>
  <div class="content" id="rtContent" style="display:block">
    <div class="grid-container" id="readingsGrid"></div>
  </div>

  <form id="configForm">
    <button type="button" class="collapsible active">Basic settings</button>
    <div class="content" style="display:block" data-section="basic"></div>

    <button type="button" class="collapsible">MQTT</button>
    <div class="content" data-section="mqtt"></div>

    <button type="button" class="collapsible">Home Assistant</button>
    <div class="content" data-section="ha"></div>

    <button type="button" class="collapsible">Advanced network</button>
    <div class="content" data-section="net"></div>

    <button type="button" class="collapsible">Telegram settings</button>
    <div class="content" data-section="tg"></div>

    <button type="button" class="collapsible">Updates</button>
    <div class="content" data-section="upd"></div>

    <button type="button" class="collapsible">EnergieID</button>
    <div class="content" data-section="eid"></div>

    <button type="button" class="collapsible">Advanced settings</button>
    <div class="content" data-section="dongle"></div>

    <button type="submit" class="submit">Save</button>
  </form>
  <button type="button" class="log-link" id="logBtn">View log</button>
  <button type="button" class="reboot" id="rebootBtn">Reboot</button>
  <div class="danger-row">
    <button type="button" class="reboot reset-wifi" id="resetWifiBtn">Reset WiFi</button>
    <button type="button" class="reboot" id="factoryResetBtn">Factory reset</button>
  </div>
  <footer><a id="footerLink" href="https://www.plan-d.io" target="_blank" rel="noopener">Digital meter dongle by plan-d.io</a></footer>
</div>

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function statusBox(id) {
    return el("div", {class: "status-box neutral", id: id}, [
      el("div", {class: "status-main"}, [
        el("span", {class: "status-dot"}),
        el("span", {class: "status-text"})
      ]),
      el("div", {class: "status-sub"})
    ]);
  }

  function setStatusBox(box, colour, main, sub) {
    if (!box) return;
    box.className = "status-box " + colour;
    var mainEl = box.querySelector(".status-text");
    var subEl = box.querySelector(".status-sub");
    if (mainEl) mainEl.textContent = main || "";
    if (subEl) {
      subEl.textContent = sub || "";
      subEl.style.display = sub ? "" : "none";
    }
  }

  function buildField(spec) {
    var key = spec[0], label = spec[1], kind = spec[2], opts = spec[3], hint = spec[4];
    var wrap = el("div", {"data-key": key});
    wrap.appendChild(el("label", {for: key, text: label}));
    var input;
    if (kind === "wifi") {
      input = el("select", {id: key, name: key});
      wrap.appendChild(input);
      var otherLab = el("label", {
        for: "WIFI_SSID_OTHER",
        id: "WIFI_SSID_OTHER_LAB",
        text: "Network name",
        style: "display:none"
      });
      var other = el("input", {
        type: "text",
        id: "WIFI_SSID_OTHER",
        name: "WIFI_SSID_OTHER",
        placeholder: "Network name",
        style: "display:none",
        autocomplete: "off"
      });
      wrap.appendChild(otherLab);
      wrap.appendChild(other);
      wrap.appendChild(el("div", {class: "field-error", id: key + "_err"}));
      function showOther(on) {
        other.style.display = on ? "" : "none";
        otherLab.style.display = on ? "" : "none";
      }
      input.addEventListener("change", function () {
        wifiUserChoice = input.value;
        showOther(input.value === "__other__");
        updateWifiPassHint();
      });
      other.addEventListener("input", updateWifiPassHint);
      return wrap;
    }
    if (kind === "checkbox") {
      input = el("input", {type: "checkbox", id: key, name: key});
    } else if (kind === "select") {
      input = el("select", {id: key, name: key});
      (opts || []).forEach(function (o) {
        input.appendChild(el("option", {value: o[0], text: o[1]}));
      });
    } else if (kind === "password") {
      input = el("input", {type: "password", id: key, name: key, autocomplete: "off"});
      if (key === "WIFI_PASS") input.maxLength = 64;
      input.dataset.secret = "1";
      input.dataset.changed = "0";
      input.addEventListener("input", function () { input.dataset.changed = "1"; });
      var row = el("div", {class: "pw-row"});
      var btn = el("button", {
        type: "button",
        class: "pw-toggle",
        title: "Show password",
        "aria-label": "Show password",
        html: EYE
      });
      btn.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show ? EYE_OFF : EYE;
        var lab = show ? "Hide password" : "Show password";
        btn.setAttribute("title", lab);
        btn.setAttribute("aria-label", lab);
      });
      row.appendChild(input);
      row.appendChild(btn);
      wrap.appendChild(row);
      if (hint) wrap.appendChild(el("p", {class: "field-hint", text: hint}));
      if (key === "WIFI_PASS") {
        wrap.appendChild(el("p", {
          class: "field-hint",
          id: "WIFI_PASS_net_hint",
          text: "Enter the password for this network, or leave blank for an open network.",
          style: "display:none"
        }));
      }
      wrap.appendChild(el("div", {class: "field-error", id: key + "_err"}));
      return wrap;
    } else {
      input = el("input", {type: kind, id: key, name: key});
    }
    wrap.appendChild(input);
    if (hint) wrap.appendChild(el("p", {class: "field-hint", text: hint}));
    wrap.appendChild(el("div", {class: "field-error", id: key + "_err"}));
    return wrap;
  }

  function renderForm() {
    Object.keys(LAYOUT).forEach(function (sec) {
      var host = document.querySelector('[data-section="' + sec + '"]');
      if (!host) return;
      host.innerHTML = "";

      if (sec === "tg") {

        ]));

      }
    });
  }

  function fieldErrId(id) {
    return "fld_" + String(id).replace(/[^A-Za-z0-9]/g, "_") + "_err";
  }

  function renderFieldChecks(list) {
    var host = document.getElementById("fieldChecks");
    if (!host) return;
    host.innerHTML = "";
    fieldInitial = {};
    var counts = {};
    (list || []).forEach(function (item) {
      counts[item.label] = (counts[item.label] || 0) + 1;
    });
    (list || []).forEach(function (item) {
      var lab = item.label;
      if (counts[item.label] > 1) {
        lab = lab + " (" + String(item.region || "").toUpperCase() + ")";
      }
      var cid = "fld_" + String(item.id).replace(/[^A-Za-z0-9]/g, "_");
      var cb = el("input", {type: "checkbox", id: cid});
      cb.dataset.id = item.id;
      cb.checked = !!item.on;
      cb.dataset.initial = item.on ? "1" : "0";
      fieldInitial[item.id] = !!item.on;
      var wrap = el("label", {class: "fld", for: cid}, [cb, document.createTextNode(lab)]);
      var cell = el("div", {class: "fld-cell"}, [
        wrap,
        el("div", {class: "field-error", id: fieldErrId(item.id)})
      ]);
      host.appendChild(cell);
    });
  }

  function loadFields() {
    return fetch("/api/fields").then(function (r) { return r.json(); }).then(function (list) {
      renderFieldChecks(list);
      syncUpdActionAvailability();
    });
  }

  function collectFieldChanges() {
    var body = {};
    var any = false;
    document.querySelectorAll("#fieldChecks input[type=checkbox]").forEach(function (cb) {
      var id = cb.dataset.id;
      var on = !!cb.checked;
      if (fieldInitial[id] !== on) {
        body[id] = on;
        any = true;
      }
    });
    return any ? body : null;
  }

  function currentWifiSsid() {
    var sel = document.getElementById("WIFI_SSID");
    if (!sel) return "";
    if (sel.value === "__other__") {
      var o = document.getElementById("WIFI_SSID_OTHER");
      return o ? o.value : "";
    }
    return sel.value;
  }

  function updateWifiPassHint() {
    var hint = document.getElementById("WIFI_PASS_net_hint");
    if (!hint) return;
    hint.style.display = currentWifiSsid() !== (initial.WIFI_SSID || "") ? "" : "none";
  }

  function fillNetworks(list) {
    var sel = document.getElementById("WIFI_SSID");
    if (!sel) return;
    var keep = wifiUserChoice !== null ? wifiUserChoice : storedSsid;
    sel.innerHTML = "";
    var seen = {};
    if (!storedSsid) {
      sel.appendChild(el("option", {value: "", text: "— Choose a network —"}));
    }
    (list || []).forEach(function (n) {
      if (!n || !n.ssid || seen[n.ssid]) return;
      seen[n.ssid] = true;
      sel.appendChild(el("option", {value: n.ssid, text: n.ssid}));
    });
    if (storedSsid && !seen[storedSsid]) {
      sel.insertBefore(el("option", {value: storedSsid, text: storedSsid}), sel.firstChild);
      seen[storedSsid] = true;
    }
    sel.appendChild(el("option", {value: "__other__", text: "Other (hidden network)…"}));
    if (keep === "__other__") {
      sel.value = "__other__";
    } else if (keep && seen[keep]) {
      sel.value = keep;
    } else if (storedSsid) {
      sel.value = storedSsid;
    } else {
      sel.value = "";
    }
    var other = document.getElementById("WIFI_SSID_OTHER");
    var otherLab = document.getElementById("WIFI_SSID_OTHER_LAB");
    var show = sel.value === "__other__";
    if (other) other.style.display = show ? "" : "none";
    if (otherLab) otherLab.style.display = show ? "" : "none";
    updateWifiPassHint();
  }

  function loadNetworks() {
    fetch("/api/networks").then(function (r) { return r.json(); }).then(function (j) {
      fillNetworks(j.networks);
      if (j.scanning) setTimeout(loadNetworks, 1000);
    }).catch(function () {});
  }

  var pendingAfterSave = false;

  function applyWifiFail(s) {
    var box = document.getElementById("wifiFailBanner");
    if (!box) return;
    if (!s.wifi && s.wifi_fail) {
      box.style.display = "";
      box.textContent = s.wifi_fail;
    } else {
      box.style.display = "none";
      box.textContent = "";
    }
  }

  function applyNetPending(s, afterSave) {
    var banner = document.getElementById("netPendingBanner");
    var hint = document.getElementById("netPendingHint");
    var info = document.getElementById("infoMessage");
    if (!banner) return;
    if (s.net_pending) {
      banner.style.display = "";
      banner.textContent = afterSave
        ? "Saved. Reboot the dongle to apply the new network settings."
        : "Reboot the dongle to apply the new network settings.";
      if (hint) hint.style.display = s.wifi ? "none" : "";
      if (afterSave && info) info.textContent = "";
    } else {
      banner.style.display = "none";
      if (hint) hint.style.display = "none";
      if (afterSave && info) {
        info.style.color = "#5aaf6f";
        info.textContent = "Saved.";
      }
    }
  }

  function applyValues(cfg) {
    initial = {};
    secretsSet = {};
    wifiUserChoice = null;
    Object.keys(LAYOUT).forEach(function (sec) {
      LAYOUT[sec].forEach(function (spec) {
        var key = spec[0], kind = spec[2];
        var entry = cfg[key];
        var input = document.getElementById(key);
        if (!input) return;
        if (entry && typeof entry === "object" && "set" in entry) {
          secretsSet[key] = !!entry.set;
          initial[key] = null;
          input.value = "";
          input.dataset.changed = "0";
          input.placeholder = entry.set ? "Leave blank to keep current" : "No password stored";
          return;
        }
        var val = entry && typeof entry === "object" ? entry.value : entry;
        if (kind === "wifi") {
          storedSsid = val == null ? "" : String(val);
          initial[key] = storedSsid;
          return;
        }
        if (kind === "checkbox") {
          input.checked = !!val;
          initial[key] = !!val;
        } else if (kind === "select") {
          input.value = String(val);
          initial[key] = String(val);
        } else {
          input.value = val == null ? "" : String(val);
          initial[key] = input.value;
        }
      });
    });
    loadNetworks();
    updateWifiPassHint();
    syncUpdActionAvailability();
    syncTrgInterval();
  }

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach(function (e) { e.textContent = ""; });
    document.getElementById("infoMessage").textContent = "";
  }

  function markError(key, msg) {
    var box = document.getElementById(key + "_err") || document.getElementById(fieldErrId(key));
    if (box) box.textContent = msg;
    document.getElementById("infoMessage").textContent = key + ": " + msg;
    var input = document.getElementById(key) ||
      document.getElementById("fld_" + String(key).replace(/[^A-Za-z0-9]/g, "_"));
    if (input) input.focus();
  }

  function collectChanges() {
    var body = {};
    var any = false;
    Object.keys(LAYOUT).forEach(function (sec) {
      LAYOUT[sec].forEach(function (spec) {
        var key = spec[0], kind = spec[2];
        var input = document.getElementById(key);
        if (!input) return;
        if (kind === "wifi") {
          var ssid = currentWifiSsid();
          if (ssid !== "" && ssid !== initial[key]) { body[key] = ssid; any = true; }
          return;
        }
        if (kind === "password") {
          var chosen = currentWifiSsid();
          if (key === "WIFI_PASS" && chosen !== "" && chosen !== (initial.WIFI_SSID || "")) {
            body[key] = input.value;
            any = true;
            return;
          }
          if (input.dataset.changed === "1" && input.value !== "") {
            body[key] = input.value;
            any = true;
          }
          return;
        }
        if (kind === "checkbox") {
          var b = !!input.checked;
          if (b !== initial[key]) { body[key] = b; any = true; }
          return;
        }
        if (kind === "number" || (kind === "select" && (key === "FRMT_PYLD" || key === "TRG_TYPE"))) {
          var n = Number(input.value);
          if (n !== Number(initial[key])) { body[key] = n; any = true; }
          return;
        }
        var s = input.value;
        if (s !== initial[key]) { body[key] = s; any = true; }
      });
    });
    return any ? body : null;
  }

  function formDirty() {
    return collectChanges() !== null || collectFieldChanges() !== null;
  }

  function syncUpdActionAvailability() {
    var dirty = formDirty();
    var onNet = !!lastStatus.wifi;
    var check = document.getElementById("updCheckBtn");
    var inst = document.getElementById("updInstallBtn");
    var hint = document.getElementById("updDirtyHint");
    if (!onNet) {
      if (check) check.disabled = true;
      if (inst) inst.disabled = true;
      if (hint) hint.style.display = "none";
      return;
    }
    if (check) check.disabled = dirty;
    if (inst) inst.disabled = dirty;
    if (hint) hint.style.display = dirty ? "" : "none";
  }

  function setIcon(id, name, labelOverride) {
    var n = document.getElementById(id);
    if (!n) return;
    n.innerHTML = ICONS[name] || "";
    var lab = labelOverride || ICON_LABELS[name] || "";
    n.setAttribute("title", lab);
    n.setAttribute("aria-label", lab);
  }

  function wifiIcon(rssiStr) {
    // Legacy ladder: abs(RSSI) thresholds from archive/P1-dongle/webHelp.h returnSvg().
    var a = Math.abs(parseInt(rssiStr, 10));
    if (isNaN(a)) return "wifi-strength-outline";
    if (a <= 45) return "wifi-strength-4";
    if (a <= 55) return "wifi-strength-3";
    if (a <= 65) return "wifi-strength-2";
    if (a <= 75) return "wifi-strength-1";
    return "wifi-strength-outline";
  }

  function brokerPendingLabel(err) {
    var e = String(err || "").toLowerCase();
    if (e.indexOf("certificate") >= 0) return "Certificate rejected";
    if (e.indexOf("tls") >= 0) return "TLS error";
    if (e.indexOf("auth") >= 0) return "Authentication failed";
    if (e.indexOf("transport") >= 0) return "Transport error";
    return ICON_LABELS["lan-pending"];
  }

  function eidIntervalText(sec) {
    var n = parseInt(sec, 10);
    if (!n) return "";
    if (n % 3600 === 0) {
      var h = n / 3600;
      return h === 1 ? "every hour" : ("every " + h + " hours");
    }
    if (n % 60 === 0) {
      var m = n / 60;
      return m === 1 ? "every minute" : ("every " + m + " minutes");
    }
    return "every " + n + " seconds";
  }

  function lastUploadText(unix) {
    var t = parseInt(unix, 10);
    if (!t) return "";
    var d = new Date(t * 1000);
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  function refreshEidStatus(s) {
    var code = document.getElementById("eidClaimCode");
    if (code) code.textContent = s.eid_claim || "";
    var box = document.getElementById("eidStatusBox");
    if (!box) return;
    var st = String(s.eid || "off");
    if (st === "no_keys") {
      setStatusBox(box, "neutral", "Not available in this firmware", "");
      return;
    }
    if (st === "off") {
      setStatusBox(box, "neutral", "Off", "");
      return;
    }
    if (st === "waiting") {
      setStatusBox(box, "attention", "Waiting for the code", "Enter it in your EnergieID account");
      return;
    }
    if (st === "linked") {
      var rec = s.eid_record || "";
      var main = rec ? ("Linked to \"" + rec + "\"") : "Linked";
      var every = eidIntervalText(s.eid_interval);
      var last = lastUploadText(s.eid_last_upload);
      var sub = "";
      if (every) {
        sub = "Uploading " + every;
        sub += last ? (", last upload " + last) : ", no upload yet";
      } else if (last) {
        sub = "Last upload " + last;
      } else {
        sub = "no upload yet";
      }
      setStatusBox(box, "ok", main, sub);
      return;
    }
    if (st === "error") {
      setStatusBox(box, "error", "EnergieID problem", s.eid_error || "");
      return;
    }
    setStatusBox(box, "neutral", st, "");
  }

  function refreshStatus() {
    fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
      lastStatus = s;
      var afterSave = pendingAfterSave;
      pendingAfterSave = false;
      applyNetPending(s, afterSave);
      applyWifiFail(s);
      document.getElementById("hostnameHeader").textContent = s.device_id || "";
      setIcon("ind-wifi", s.wifi ? wifiIcon(s.rssi) : "wifi-strength-outline");
      setIcon("ind-meter", s.meter ? "counter" : "numeric-off");
      var mqttOk = String(s.mqtt || "").toLowerCase() === "connected";
      if (!s.mqtt_en) setIcon("ind-broker", "lan-disconnect");
      else if (mqttOk) setIcon("ind-broker", "lan-connect");
      else setIcon("ind-broker", "lan-pending", brokerPendingLabel(s.mqtt_err));
      if (!s.ha_en) setIcon("ind-ha", "cloud-cog-outline");
      else if (mqttOk) setIcon("ind-ha", "cloud-outline");
      else setIcon("ind-ha", "cloud-off-outline");
      var footer = document.getElementById("footerLink");
      if (footer && s.fw_ver) {
        footer.textContent = "Digital meter dongle V" + s.fw_ver + " by plan-d.io";
      }
      refreshUpdStatus(s);
      refreshEidStatus(s);
    }).catch(function () {});
  }

  function pickTiles(data) {
    var byId = {};
    (data || []).forEach(function (item) { if (item && item.id) byId[item.id] = item; });
    var preferred = ["A-0:0.0.1", "A-0:0.0.2", "A-0:0.0.3", "1-0:1.4.0", "1-0:1.6.0"];
    var mbus = ["0-1:24.2.3", "0-1:24.2.1", "0-2:24.2.1"];
    var out = [];
    preferred.forEach(function (id) { if (byId[id]) out.push(byId[id]); });
    mbus.forEach(function (id) { if (byId[id]) out.push(byId[id]); });
    return out.slice(0, 6);
  }

  function refreshReadings() {
    fetch("/api/data").then(function (r) { return r.json(); }).then(function (data) {
      var grid = document.getElementById("readingsGrid");
      grid.innerHTML = "";
      pickTiles(data).forEach(function (item) {
        var cell = el("div", {class: "grid-item"}, [
          el("div", {class: "friendly-name", html: "<strong>" + (item.label || item.id) + "</strong>"}),
          el("div", {text: (item.value || "") + (item.unit ? " " + item.unit : "")})
        ]);
        grid.appendChild(cell);
      });
    }).catch(function () {});
  }

  document.querySelectorAll(".collapsible").forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.classList.toggle("active");
      var content = btn.nextElementSibling;
      if (!content) return;
      content.style.display = content.style.display === "block" ? "none" : "block";
    });
  });

  document.getElementById("configForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    clearErrors();
    var passEl = document.getElementById("WIFI_PASS");
    if (passEl && passEl.dataset.changed === "1") {
      var pw = passEl.value || "";
      if (pw.length === 64 && !/^[0-9a-fA-F]{64}$/.test(pw)) {
        markError("WIFI_PASS", "A 64-character WiFi password must be 64 hex digits (WPA key).");
        document.getElementById("infoMessage").style.color = "#ff8a8a";
        document.getElementById("infoMessage").textContent = "A 64-character WiFi password must be 64 hex digits (WPA key).";
        return;
      }
    }
    var cfgBody = collectChanges();
    var fldBody = collectFieldChanges();
    if (!cfgBody && !fldBody) {
      document.getElementById("infoMessage").textContent = "No changes.";
      document.getElementById("infoMessage").style.color = "#5aaf6f";
      return;
    }
    function handleErr(res) {
      document.getElementById("infoMessage").style.color = "#ff8a8a";
      var m = /^(Parse|UnknownKey|WrongType|Invalid):(.+)$/.exec(res.text.trim());
      if (m) {
        markError(m[2], m[1] === "Invalid" ? "Invalid value" : m[1]);
      } else {
        document.getElementById("infoMessage").textContent = res.text || ("Error " + res.status);
      }
    }
    function postFields() {
      if (!fldBody) {
        return loadFields();
      }
      return fetch("/fields", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(fldBody)
      }).then(function (r) {
        return r.text().then(function (t) { return {ok: r.ok, status: r.status, text: t}; });
      }).then(function (res) {
        if (!res.ok) {
          handleErr(res);
          return null;
        }
        return loadFields();
      });
    }
    function finishOk() {
      pendingAfterSave = true;
      refreshStatus();
      syncUpdActionAvailability();
    }
    if (cfgBody) {
      fetch("/config", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cfgBody)
      }).then(function (r) {
        return r.text().then(function (t) { return {ok: r.ok, status: r.status, text: t}; });
      }).then(function (res) {
        if (!res.ok) {
          handleErr(res);
          return;
        }
        return postFields().then(function (ok) {
          if (ok === null) return;
          finishOk();
          return fetch("/config").then(function (r) { return r.json(); }).then(applyValues);
        });
      }).catch(function (e) {
        document.getElementById("infoMessage").textContent = String(e);
      });
    } else {
      postFields().then(function (ok) {
        if (ok === null) return;
        finishOk();
      }).catch(function (e) {
        document.getElementById("infoMessage").textContent = String(e);
      });
    }
  });

    window.location.href = "/log";

  document.getElementById("rebootBtn").addEventListener("click", function () {
    window.location.href = "/rebooting";
  });

          "Clear the WiFi network settings and password? The dongle will restart and reopen its 'p1dongle' setup network. All other settings are kept.")) {
      window.location.href = "/rebooting?reset=wifi";

  document.getElementById("factoryResetBtn").addEventListener("click", function () {
    if (window.confirm(

      window.location.href = "/rebooting?reset=factory";
    }

  function formatUpdVer(n) {
    if (!n) return "";
    var major = Math.floor(n / 100);
    var frac = n % 100;
    return major + "." + (frac < 10 ? "0" : "") + frac;
  }

  function runningOnLine(s) {
    var run = s.fw_ver || "";
    var chan = s.upd_channel || "";
    if (!run) return chan ? ("on " + chan) : "";
    return chan ? ("Running " + run + " on " + chan) : ("Running " + run);
  }

  function refreshUpdStatus(s) {
    var box = document.getElementById("updStatusBox");
    var inst = document.getElementById("updInstallBtn");
    if (box) {
      if (!s.wifi) {
        setStatusBox(box, "neutral", "Not on a network yet",
                     "Updates are available once the dongle is on your network.");
      } else if (s.upd_fail) {
        setStatusBox(box, "error", "Update failed", s.upd_fail);
      } else if (s.upd_checked && s.upd_available && s.upd_found) {
        setStatusBox(box, "attention", "Update " + formatUpdVer(s.upd_found) + " available",
                     runningOnLine(s));
      } else if (s.upd_checked) {
        setStatusBox(box, "ok", "Up to date", runningOnLine(s));
      } else {
        setStatusBox(box, "neutral", "Not checked yet", s.fw_ver ? ("Running " + s.fw_ver) : "");
      }
    }
    if (inst) {
      inst.style.display = s.upd_available ? "" : "none";
    }
    syncUpdActionAvailability();
  }

  function syncTrgInterval() {
    var t = document.getElementById("TRG_TYPE");
    var i = document.getElementById("TRG_INT");

    i.parentNode.style.display = t.value === "1" ? "" : "none";
  }

  renderForm();
  var trgType = document.getElementById("TRG_TYPE");
  if (trgType) trgType.addEventListener("change", syncTrgInterval);
  syncTrgInterval();

  document.getElementById("updCheckBtn").addEventListener("click", function () {
    if (!lastStatus.wifi || formDirty()) return;
    document.getElementById("infoMessage").textContent = "Checking…";
    fetch("/update/check", {method: "POST"}).then(function (r) {
      return r.text().then(function (t) { return {ok: r.ok, text: t}; });
    }).then(function (res) {

        document.getElementById("infoMessage").textContent = res.text || "Check failed";

      document.getElementById("infoMessage").textContent = "Check started.";

  document.getElementById("updInstallBtn").addEventListener("click", function () {

          "Install the available firmware update? The dongle will be unreachable for a few minutes while it downloads and reboots.")) {
      return;
    }
    window.location.href = "/rebooting?update=install";
  });

  document.getElementById("configForm").addEventListener("input", syncUpdActionAvailability);
  document.getElementById("configForm").addEventListener("change", syncUpdActionAvailability);

  (function wireTlsPortToggle() {
    var tls = document.getElementById("MQTT_TLS");
    var port = document.getElementById("MQTT_PORT");
    if (!tls || !port) return;
    var autoFlipped = false;
    port.addEventListener("input", function () { autoFlipped = false; });
    tls.addEventListener("change", function () {
      var cur = Number(port.value);
      var loaded = Number(initial.MQTT_PORT);
      if (tls.checked) {
        if (cur === loaded && loaded === 1883) {
          port.value = "8883";
          autoFlipped = true;
        }
      } else {
        if (autoFlipped && cur === 8883) {
          port.value = "1883";
          autoFlipped = false;
        } else if (cur === loaded && loaded === 8883) {
          port.value = "1883";
        }
      }
      syncUpdActionAvailability();
    });
  })();

  fetch("/config").then(function (r) { return r.json(); }).then(applyValues).catch(function () {});
  loadFields().catch(function () {});
  refreshStatus();
  refreshReadings();
  setInterval(refreshStatus, 5000);
  setInterval(refreshReadings, 3000);
})();
</script>
