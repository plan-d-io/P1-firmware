; P1 firmware — PlatformIO project configuration.
;
; Pinned to the pioarduino Espressif32 platform rather than `espressif32`,
; which would resolve to PlatformIO's official platform. Do not change the
; pinned version without a concrete reason.

[platformio]
default_envs = dongle

; ---------------------------------------------------------------------------
; Settings shared by every firmware target.
; ESP32-only keys (platform, framework, partitions, flash) live on [env:dongle]
; so [env:native] can be a genuine host build.
; ---------------------------------------------------------------------------
[env]
monitor_speed = 115200
build_flags = -Wall
extra_scripts =
    pre:tools/embed_web.py
    pre:tools/eid_keys.py

; ---------------------------------------------------------------------------
; P1 dongle — M5Stack Atom (ESP32-PICO-D4). The current focus.
; Ships as plan-d-io/P1-dongle.
; ---------------------------------------------------------------------------
[env:dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = m5stack-atom
lib_deps = esphome/dsmr_parser @ ^1.10.0
test_ignore = *

; Partition scheme. p1_dongle.csv reproduces the table fielded dongles have
; had since legacy V0.89: app0/app1 0x1E0000 (1,966,080 B) each with OTA,
; 20 KB NVS, 8 KB otadata, 192 KB SPIFFS. No coredump partition. MUST NOT
; CHANGE: OTA rewrites app partitions but cannot rewrite the partition table,
; so a different layout cannot reach devices in the field.
board_build.partitions = p1_dongle.csv
board_build.filesystem = littlefs
; Fielded bootloaders and the legacy firmware are DIO 80 MHz. QIO selects the
; framework's QIO flash driver, which reads and writes NVS and the filesystem
; wrongly under those bootloaders. Never switch back.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
; Shared application plus this product's P1 input. The LoRa apps and the
; board test stay out of the dongle image.
build_src_filter = +<app/> +<dongle/>

; ---------------------------------------------------------------------------
; Host-side unit tests (parser, frame packing — anything with no hardware
; dependency). Requires a host compiler on PATH; on Windows that means MinGW
; or similar. Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; Same mbedtls the ESP32 framework ships (3.6.5). The firmware targets link
; the framework copy. This pin is only so the host tests can build AES and
; SHA-256. lib_ignore keeps PlatformIO from compiling the whole tree.
lib_deps =
    esphome/dsmr_parser @ ^1.10.0
    https://github.com/Mbed-TLS/mbedtls.git#v3.6.5
lib_ignore = mbedtls
extra_scripts =
    pre:tools/embed_web.py
    pre:tools/eid_keys.py
    pre:tools/mbedtls_native.py
build_flags =
    -std=c++20
    -Wall
    -DFIXTURES_DIR=\"${PROJECT_DIR}/fixtures\"

; ---------------------------------------------------------------------------
; TTGO T3 v1.6.1 board test. Flash this on a new TTGO to check the chip,
; flash, LED, button, OLED address and radio version register before real
; firmware. It reads one radio register and never transmits.
; ---------------------------------------------------------------------------
[env:ttgo-boardtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = p1_dongle.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts =
build_src_filter = +<boardtest/>

; ---------------------------------------------------------------------------
; P1 LoRa bridge — LilyGO TTGO T3 v1.6.1, SX1276.
; RadioLib 7.8.1 is the last release before 8.0.0 removed the SX127x begin()
; these apps call. User settings and the desk key are compile flags, not
; edits to this file.
; ---------------------------------------------------------------------------
[env:lora-receiver]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = p1_dongle.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts =
    pre:tools/embed_web.py
    pre:tools/eid_keys.py
build_src_filter = +<app/> +<lora-receiver/>
lib_deps =
    https://github.com/jgromes/RadioLib.git#7.8.1
    esphome/dsmr_parser @ ^1.10.0

[env:lora-transmitter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = ttgo-lora32-v21
board_build.partitions = p1_dongle.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts =
build_src_filter = +<lora-transmitter/>
lib_deps =
    https://github.com/jgromes/RadioLib.git#7.8.1
    esphome/dsmr_parser @ 1.10.0

; [env:sensor]
