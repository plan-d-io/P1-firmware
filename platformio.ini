; P1 firmware — PlatformIO project configuration.
;
; Pinned to the pioarduino Espressif32 platform rather than `espressif32`,
; which would resolve to PlatformIO's official platform. Do not change the
; pinned version without a concrete reason.

[platformio]
default_envs = dongle

; ---------------------------------------------------------------------------
; Settings shared by every firmware target.
; ESP32-only keys (platform, framework, partitions, flash) live on [env:dongle]
; so [env:native] can be a genuine host build.
; ---------------------------------------------------------------------------
[env]
monitor_speed = 115200
build_flags = -Wall

; ---------------------------------------------------------------------------
; P1 dongle — M5Stack Atom (ESP32-PICO-D4). The current focus.
; Ships as plan-d-io/P1-dongle.
; ---------------------------------------------------------------------------
[env:dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = m5stack-atom
lib_deps = esphome/dsmr_parser @ ^1.10.0
test_ignore = *

; Partition scheme. min_spiffs.csv = app0/app1 0x1E0000 (1,966,080 B) each with
; OTA + 128 KB SPIFFS, identical to the Arduino IDE "Minimal SPIFFS
; (1.9MB APP with OTA/128KB SPIFFS)" setting the fielded firmware was built
; with. MUST NOT CHANGE: OTA rewrites app partitions but cannot rewrite the
; partition table, so a different layout cannot reach devices in the field.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; ---------------------------------------------------------------------------
; Host-side unit tests (parser, frame packing — anything with no hardware
; dependency). Requires a host compiler on PATH; on Windows that means MinGW
; or similar. Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps = esphome/dsmr_parser @ ^1.10.0
build_flags =
    -std=c++20
    -Wall
    -DFIXTURES_DIR=\"${PROJECT_DIR}/fixtures\"

